<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b1320" />
<title>Racing Club TW — En vivo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b1320; color: #fff;
  }
  body { display: flex; justify-content: center; padding: 20px; }
  .wrap { width: 100%; max-width: 520px; }

  .logo-row { text-align: center; margin-bottom: 18px; }
  .logo-row img { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; }
  .logo-row h1 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; margin: 8px 0 0; }
  .logo-row h3 { font-weight: 400; color: #bcc4d1; margin: 2px 0 0; font-size: 0.85rem; }

  /* ---------- Marcador estilo tenis (misma familia que display.html) ---------- */
  .ts-board {
    background: rgba(11, 19, 32, 0.94); border-radius: 10px; overflow: hidden;
    border: 1px solid #3a4256; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5); margin-bottom: 20px;
  }
  .ts-head {
    display: flex; align-items: center; justify-content: space-between;
    background: #131a27; padding: 8px 14px; font-size: 0.72rem; color: #8a94a6;
    letter-spacing: 1px; text-transform: uppercase; border-bottom: 1px solid #232c3d;
  }
  .ts-head span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ts-live { color: #ff4b4b; font-weight: 800; display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .ts-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff4b4b; animation: tsPulse 1.2s infinite; }
  @keyframes tsPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .ts-row {
    display: flex; align-items: center; padding: 12px 14px; gap: 10px;
    border-bottom: 1px solid #1c2433;
  }
  .ts-row:last-of-type { border-bottom: none; }
  .ts-serve {
    width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 35% 30%, #fbff5c, #d7d400 75%);
    box-shadow: 0 0 6px rgba(255, 247, 0, 0.85);
    opacity: 0; transform: scale(0.4);
  }
  .ts-serve.active { opacity: 1; transform: scale(1); }
  .ts-name {
    flex: 1; font-weight: 700; font-size: 1rem; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ts-sets { display: flex; gap: 6px; flex-shrink: 0; }
  .ts-set {
    width: 26px; text-align: center; font-size: 0.9rem; color: #8a94a6;
    font-variant-numeric: tabular-nums;
  }
  .ts-set.won { color: #fff; font-weight: 700; }
  .ts-current {
    width: 46px; height: 38px; display: flex; align-items: center; justify-content: center;
    background: #3fa9f5; color: #0b1320; font-weight: 900; font-size: 1.4rem; border-radius: 8px;
    font-variant-numeric: tabular-nums; flex-shrink: 0;
  }
  .ts-row.b .ts-current { background: #ff4b4b; }
  .ts-foot {
    display: flex; align-items: center; justify-content: space-between;
    background: #131a27; padding: 7px 14px; font-size: 0.78rem; color: #8a94a6;
    border-top: 1px solid #232c3d;
  }
  .ts-setstatus { font-weight: 700; color: #ffcc00; }

  .yt-btn {
    display: block; text-align: center; margin: 0; border-top: 1px solid #232c3d;
    background: #ff0000; color: #fff; text-decoration: none;
    padding: 12px; font-weight: 700; font-size: 0.9rem;
  }

  .offline {
    text-align: center; color: #8a94a6; margin-top: 30px; font-size: 0.95rem; line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <img src="logo.png" alt="" />
    <h1>Racing Club TW</h1>
    <h3>Partidos en vivo</h3>
  </div>

  <div id="liveList"></div>
  <div id="offlineSection" class="offline" style="display:none;">
    No hay ningún partido en vivo en este momento.<br>
    Volvé a entrar cuando empiece alguna transmisión.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"\'']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  // Cajitas chicas de sets ya jugados, a partir de set_history:
  // [{set, score_a, score_b}, ...]
  function renderSetHistory(s, side) {
    const history = s.set_history || [];
    return history.map((h) => {
      const mine = side === "a" ? h.score_a : h.score_b;
      const other = side === "a" ? h.score_b : h.score_a;
      const won = mine > other;
      return `<span class="ts-set${won ? " won" : ""}">${mine}</span>`;
    }).join("");
  }

  function footStatus(s) {
    const setsToWin = s.sets_to_win || 1;
    if (s.match_status === "A") return { text: `Ganó ${escapeHtml(s.team_a_name)}`, color: "#ff4b4b" };
    if (s.match_status === "B") return { text: `Ganó ${escapeHtml(s.team_b_name)}`, color: "#3fa9f5" };
    return { text: setsToWin > 1 ? `Set ${s.current_set || 1} en juego` : "En juego", color: "#ffcc00" };
  }

  function render(matches) {
    const list = document.getElementById("liveList");
    const offline = document.getElementById("offlineSection");

    if (!matches || matches.length === 0) {
      list.innerHTML = "";
      offline.style.display = "block";
      return;
    }
    offline.style.display = "none";

    list.innerHTML = matches.map((s) => {
      const usesSets = (s.sets_to_win || 1) > 1;
      const st = footStatus(s);
      return `
        <div class="ts-board">
          <div class="ts-head">
            <span>${escapeHtml(s.label)}</span>
            <span class="ts-live"><span class="ts-dot"></span>EN VIVO</span>
          </div>
          <div class="ts-row a">
            <span class="ts-serve${s.server === "A" ? " active" : ""}"></span>
            <span class="ts-name">${escapeHtml(s.team_a_name)}</span>
            ${usesSets ? `<span class="ts-sets">${renderSetHistory(s, "a")}</span>` : ""}
            <span class="ts-current">${s.score_a}</span>
          </div>
          <div class="ts-row b">
            <span class="ts-serve${s.server === "B" ? " active" : ""}"></span>
            <span class="ts-name">${escapeHtml(s.team_b_name)}</span>
            ${usesSets ? `<span class="ts-sets">${renderSetHistory(s, "b")}</span>` : ""}
            <span class="ts-current">${s.score_b}</span>
          </div>
          <div class="ts-foot">
            <span class="ts-setstatus" style="color:${st.color};">${st.text}</span>
          </div>
          ${s.youtube_url ? `<a class="yt-btn" href="${escapeHtml(s.youtube_url)}" target="_blank">▶ Ver transmisión en YouTube</a>` : ""}
        </div>
      `;
    }).join("");
  }

  async function loadLive() {
    const { data } = await client
      .from("matches")
      .select("*")
      .eq("is_live", true)
      .order("updated_at", { ascending: false });
    render(data);
  }

  client
    .channel("live-page")
    .on("postgres_changes", { event: "*", schema: "public", table: "matches" }, () => loadLive())
    .subscribe();

  loadLive();
</script>
</body>
</html>
