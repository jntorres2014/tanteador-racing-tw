<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b1320" />
<title>Racing Club TW — En vivo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b1320; color: #fff;
  }
  body { display: flex; justify-content: center; padding: 20px; }
  .wrap { width: 100%; max-width: 520px; }

  .logo-row { text-align: center; margin-bottom: 12px; }
  .logo-row img { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; }
  .logo-row h1 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; margin: 8px 0 0; }
  .logo-row h3 { font-weight: 400; color: #bcc4d1; margin: 2px 0 0; font-size: 0.85rem; }

  .live-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255, 75, 75, 0.15); color: #ff4b4b; font-weight: 700;
    padding: 5px 12px; border-radius: 20px; font-size: 0.78rem; margin-bottom: 10px;
  }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #ff4b4b; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

  .board {
    background: #1b2433; border-radius: 18px; padding: 18px;
    border: 3px solid #3fa9f5; margin-bottom: 16px;
  }
  .board-label { font-weight: 700; font-size: 1rem; margin-bottom: 10px; }

  .teams { display: flex; gap: 12px; margin-bottom: 10px; }
  .team {
    flex: 1; background: #222b3a; border-radius: 14px; padding: 12px;
    text-align: center; border: 2px solid #3fa9f5;
  }
  .team.a { border-color: #ff4b4b; }
  .team.b { border-color: #3fa9f5; }
  .team-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 4px; }
  .score { font-size: 2.2rem; font-weight: bold; font-variant-numeric: tabular-nums; }

  #matchStatus-placeholder { text-align: center; font-size: 0.9rem; }

  .yt-btn {
    display: block; text-align: center; margin-top: 10px;
    background: #ff0000; color: #fff; text-decoration: none;
    padding: 12px; border-radius: 10px; font-weight: 700; font-size: 0.9rem;
  }

  .offline {
    text-align: center; color: #8a94a6; margin-top: 30px; font-size: 0.95rem; line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <img src="logo.png" alt="" />
    <h1>Racing Club TW</h1>
    <h3>Partidos en vivo</h3>
  </div>

  <div id="liveList"></div>
  <div id="offlineSection" class="offline" style="display:none;">
    No hay ningún partido en vivo en este momento.<br>
    Volvé a entrar cuando empiece alguna transmisión.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"\'']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  function statusText(s) {
    if (s.match_status === "A") return { text: `Ganó ${s.team_a_name}`, color: "#ff4b4b" };
    if (s.match_status === "B") return { text: `Ganó ${s.team_b_name}`, color: "#3fa9f5" };
    return { text: "En juego", color: "#fff" };
  }

  function render(matches) {
    const list = document.getElementById("liveList");
    const offline = document.getElementById("offlineSection");

    if (!matches || matches.length === 0) {
      list.innerHTML = "";
      offline.style.display = "block";
      return;
    }
    offline.style.display = "none";

    list.innerHTML = matches.map((s) => {
      const st = statusText(s);
      return `
        <div>
          <div class="live-badge"><span class="live-dot"></span> EN VIVO</div>
          <div class="board">
            <div class="board-label">${escapeHtml(s.label)}</div>
            <div class="teams">
              <div class="team a">
                <div class="team-name">${escapeHtml(s.team_a_name)}</div>
                <div class="score">${s.score_a}</div>
              </div>
              <div class="team b">
                <div class="team-name">${escapeHtml(s.team_b_name)}</div>
                <div class="score">${s.score_b}</div>
              </div>
            </div>
            <div style="text-align:center; color:${st.color}; font-weight:700;">${st.text}</div>
            ${s.youtube_url ? `<a class="yt-btn" href="${escapeHtml(s.youtube_url)}" target="_blank">▶ Ver transmisión en YouTube</a>` : ""}
          </div>
        </div>
      `;
    }).join("");
  }

  async function loadLive() {
    const { data } = await client
      .from("matches")
      .select("*")
      .eq("is_live", true)
      .order("updated_at", { ascending: false });
    render(data);
  }

  client
    .channel("live-page")
    .on("postgres_changes", { event: "*", schema: "public", table: "matches" }, () => loadLive())
    .subscribe();

  loadLive();
</script>
</body>
</html>
