<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b1320" />
<title>Racing Club TW — En vivo</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b1320; color: #fff;
    display: flex; justify-content: center; align-items: center;
  }
  .wrap { width: 100%; max-width: 480px; padding: 20px; }

  .logo-row { text-align: center; margin-bottom: 12px; }
  .logo-row img { width: 72px; height: 72px; border-radius: 12px; object-fit: cover; }
  .logo-row h1 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; margin: 8px 0 0; }
  .logo-row h3 { font-weight: 400; color: #bcc4d1; margin: 2px 0 0; font-size: 0.85rem; }

  .live-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255, 75, 75, 0.15); color: #ff4b4b; font-weight: 700;
    padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; margin: 16px auto;
  }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4b4b; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  .center { text-align: center; }

  .board {
    background: #1b2433; border-radius: 18px; padding: 20px;
    border: 3px solid #3fa9f5; margin-top: 12px;
  }

  .teams { display: flex; gap: 12px; margin-bottom: 12px; }
  .team {
    flex: 1; background: #222b3a; border-radius: 14px; padding: 14px;
    text-align: center; border: 2px solid #3fa9f5;
  }
  .team.a { border-color: #ff4b4b; }
  .team.b { border-color: #3fa9f5; }
  .team-name { font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
  .score { font-size: 2.8rem; font-weight: bold; font-variant-numeric: tabular-nums; }

  #matchStatus { text-align: center; font-size: 1rem; margin-top: 4px; }

  .yt-btn {
    display: block; text-align: center; margin-top: 16px;
    background: #ff0000; color: #fff; text-decoration: none;
    padding: 14px; border-radius: 12px; font-weight: 700;
  }

  .offline {
    text-align: center; color: #8a94a6; margin-top: 30px; font-size: 0.95rem; line-height: 1.6;
  }
</style>
</head>

    <h1>Racing Club TW</h1>
    <h3>Trinquete Francisco García</h3>
  </div>

  <div id="liveSection" style="display:none;">
    <div class="center">
      <div class="live-badge"><span class="live-dot"></span> EN VIVO</div>
    </div>
    <div class="board">
      <div class="teams">
        <div class="team a">
          <div class="team-name" id="nameA">Local</div>
          <div class="score" id="scoreA">0</div>
        </div>
        <div class="team b">
          <div class="team-name" id="nameB">Visitante</div>
          <div class="score" id="scoreB">0</div>
        </div>
      </div>
      <div id="matchStatus">En juego</div>
    </div>
    <a id="ytLink" class="yt-btn" href="#" target="_blank" style="display:none;">▶ Ver transmisión en YouTube</a>
  </div>

  <div id="offlineSection" class="offline">
    No hay ningún partido en vivo en este momento.<br>
    Volvé a entrar cuando empiece la transmisión.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const defaultState = { team_a_name: "Local", team_b_name: "Visitante", score_a: 0, score_b: 0, match_status: "playing" };
  let currentState = { ...defaultState };
  let liveInfo = { is_live: false, youtube_url: "" };

  function render() {
    const liveSection = document.getElementById("liveSection");
    const offlineSection = document.getElementById("offlineSection");

    if (!liveInfo.is_live) {
      liveSection.style.display = "none";
      offlineSection.style.display = "block";
      return;
    }
    liveSection.style.display = "block";
    offlineSection.style.display = "none";

    const s = currentState;
    document.getElementById("nameA").textContent = s.team_a_name;
    document.getElementById("nameB").textContent = s.team_b_name;
    document.getElementById("scoreA").textContent = s.score_a;
    document.getElementById("scoreB").textContent = s.score_b;

    const statusEl = document.getElementById("matchStatus");
    if (s.match_status === "A") { statusEl.textContent = `Ganó ${s.team_a_name}`; statusEl.style.color = "#ff4b4b"; }
    else if (s.match_status === "B") { statusEl.textContent = `Ganó ${s.team_b_name}`; statusEl.style.color = "#3fa9f5"; }
    else { statusEl.textContent = "En juego"; statusEl.style.color = "#fff"; }

    const ytLink = document.getElementById("ytLink");
    if (liveInfo.youtube_url) { ytLink.href = liveInfo.youtube_url; ytLink.style.display = "block"; }
    else { ytLink.style.display = "none"; }
  }

  async function loadInitial() {
    const { data: s } = await client.from("match_state").select("*").eq("id", 1).single();
    if (s) currentState = s;
    const { data: l } = await client.from("match_live").select("*").eq("id", 1).single();
    if (l) liveInfo = l;
    render();
  }

  client
    .channel("match-live-page")
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "match_state", filter: "id=eq.1" },
      (payload) => { currentState = payload.new; render(); })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "match_live", filter: "id=eq.1" },
      (payload) => { liveInfo = payload.new; render(); })
    .subscribe();

  loadInitial();
</script>
