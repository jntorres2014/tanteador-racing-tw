<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b1320" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="logo.png" />
<title>Racing Club TW — Torneos</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b1320; color: #fff;
  }
  body { display: flex; justify-content: center; padding: 20px; }
  .wrap { width: 100%; max-width: 640px; }

  .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .back-link { color: #8a94a6; text-decoration: none; font-size: 0.85rem; }
  h1 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: 1.5px; margin: 0; text-align: center; flex: 1; }

  .tournament-card {
    background: #1b2433; border-radius: 14px; padding: 16px 18px;
    margin-bottom: 12px; border: 2px solid #3a4256; cursor: pointer;
  }
  .tournament-card:hover { border-color: #3fa9f5; }
  .t-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .t-name { font-weight: 700; font-size: 1.02rem; }
  .t-sub { color: #8a94a6; font-size: 0.82rem; margin-top: 2px; }
  .t-status {
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
    padding: 4px 9px; border-radius: 10px; white-space: nowrap;
  }
  .status-draft { background: rgba(255,204,0,0.15); color: #ffcc00; }
  .status-published, .status-in_progress { background: rgba(63,169,245,0.15); color: #3fa9f5; }
  .status-finished { background: rgba(90,220,140,0.15); color: #5adc8c; }
  .status-archived { background: rgba(138,148,166,0.15); color: #8a94a6; }

  .t-progress { color: #bcc4d1; font-size: 0.82rem; margin-top: 10px; }

  .empty { text-align: center; color: #8a94a6; padding: 30px 10px; font-size: 0.9rem; }

  /* Detalle de un torneo */
  .detail-header {
    background: #1b2433; border-radius: 14px; padding: 16px 18px;
    margin-bottom: 18px; border: 2px solid #3a4256;
  }
  .detail-header h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .detail-header .meta { color: #8a94a6; font-size: 0.82rem; }
  .publish-btn {
    margin-top: 12px; width: 100%; border: none; border-radius: 10px; padding: 11px;
    background: #ffcc00; color: #0b1320; font-weight: 700; font-size: 0.88rem; cursor: pointer;
  }
  .delete-btn {
    margin-top: 8px; width: 100%; border: 2px solid #ff4b4b; border-radius: 10px; padding: 10px;
    background: transparent; color: #ff4b4b; font-weight: 700; font-size: 0.85rem; cursor: pointer;
  }
  .delete-btn:hover { background: rgba(255,75,75,0.1); }

  h3.group-title {
    font-size: 0.82rem; text-transform: uppercase; letter-spacing: 1.5px;
    color: #8a94a6; margin: 22px 0 10px;
  }

  .match-card {
    background: #1b2433; border-radius: 14px; padding: 13px 16px;
    margin-bottom: 9px; border: 2px solid #3a4256;
  }
  .match-card.finished { border-color: #2c3549; opacity: 0.85; }
  .match-card.live { border-color: #ff4b4b; }
  .match-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .match-label { font-weight: 700; font-size: 0.9rem; color: #bcc4d1; }
  .live-tag {
    background: rgba(255,75,75,0.15); color: #ff4b4b; font-size: 0.68rem; font-weight: 700;
    padding: 3px 8px; border-radius: 10px;
  }
  .finished-tag {
    background: rgba(90,220,140,0.12); color: #5adc8c; font-size: 0.68rem; font-weight: 700;
    padding: 3px 8px; border-radius: 10px;
  }
  .pending-tag {
    background: rgba(138,148,166,0.12); color: #8a94a6; font-size: 0.68rem; font-weight: 700;
    padding: 3px 8px; border-radius: 10px;
  }
  .match-score { font-size: 0.98rem; color: #eee; margin-bottom: 10px; }
  .match-score .vs { color: #8a94a6; font-weight: 400; font-size: 0.85rem; }
  .match-links { display: flex; gap: 8px; }
  .match-links a {
    flex: 1; text-align: center; text-decoration: none; font-size: 0.8rem; font-weight: 600;
    padding: 8px; border-radius: 8px;
  }
  .link-control { background: #3fa9f5; color: #fff; }

  .referee-row {
    display: flex; align-items: center; gap: 8px; margin-top: 8px;
    padding-top: 8px; border-top: 1px solid #2a3448;
  }
  .referee-row label { font-size: 0.75rem; color: #8a94a6; white-space: nowrap; }
  .referee-row select {
    flex: 1; padding: 6px 8px; border-radius: 8px; border: none;
    background: #222b3a; color: #fff; font-size: 0.8rem;
  }

  .bell-btn {
    background: none; border: none; cursor: pointer; font-size: 0.85rem;
    padding: 0 2px; opacity: 0.6; vertical-align: middle;
  }
  .bell-btn:hover { opacity: 1; }
  .bell-btn.subscribed { opacity: 1; }
  .sub-check {
    background: none; border: none; cursor: pointer;
    font-size: 0.85rem; color: #5adc8c; vertical-align: middle; padding: 0 2px;
  }
  .sub-check:hover { opacity: 0.75; }

  /* Barra de login (auth.js) */
  .auth-bar {
    background: #1b2433; border-radius: 12px; padding: 10px 14px;
    margin-bottom: 16px; border: 2px solid #3a4256;
    display: flex; align-items: center; justify-content: center;
  }
  .auth-bar-out { padding: 14px; }
  .auth-btn-google {
    width: 100%; background: #fff; color: #1a1a1a; border: none;
    border-radius: 10px; padding: 12px; font-weight: 700; font-size: 0.92rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .auth-google-g {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%; background: #4285F4;
    color: #fff; font-size: 0.72rem; font-weight: 900;
  }
  .auth-bar-in { justify-content: space-between; }
  .auth-user { display: flex; align-items: center; gap: 10px; }
  .auth-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
  .auth-avatar-fallback {
    display: flex; align-items: center; justify-content: center;
    background: #3fa9f5; color: #fff; font-weight: 700; font-size: 0.95rem;
  }
  .auth-name { font-weight: 600; font-size: 0.88rem; text-align: left; }
  .auth-role { font-size: 0.72rem; color: #8a94a6; margin-top: 1px; }
  .auth-role-admin { color: #ffcc00; font-weight: 600; }
  .auth-pending { font-size: 0.72rem; color: #ff9d4b; margin-top: 1px; }
  .auth-btn-logout {
    background: #3a4256; color: #fff; border: none; border-radius: 8px;
    padding: 8px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
  }

  .admin-actions { display: flex; gap: 10px; margin-bottom: 16px; }
  .admin-actions a {
    flex: 1; text-align: center; text-decoration: none;
    background: #222b3a; color: #fff; font-weight: 700;
    border-radius: 12px; padding: 12px; font-size: 0.85rem;
  }

  .filter-row { display: flex; gap: 8px; margin: 16px 0 8px; flex-wrap: wrap; }
  .search-box {
    flex: 2; min-width: 180px; padding: 10px 12px; border-radius: 10px; border: 2px solid #3a4256;
    background: #1b2433; color: #fff; font-size: 0.85rem;
  }
  .search-box::placeholder { color: #8a94a6; }
  .filter-row select {
    flex: 1; min-width: 130px; padding: 10px 12px; border-radius: 10px; border: 2px solid #3a4256;
    background: #1b2433; color: #fff; font-size: 0.85rem;
  }

  .tab-row { display: flex; gap: 8px; margin-bottom: 4px; }
  .tab-btn {
    flex: 1; padding: 10px; border-radius: 10px; border: 2px solid #3a4256;
    background: #1b2433; color: #8a94a6; font-weight: 700; font-size: 0.85rem; cursor: pointer;
  }
  .tab-btn.active { border-color: #3fa9f5; color: #fff; }
  .hidden-tab { display: none; }

  .player-card {
    background: #1b2433; border-radius: 14px; padding: 12px 16px;
    margin-bottom: 9px; border: 2px solid #3a4256;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .player-name { font-weight: 700; font-size: 0.92rem; }
  .player-status { color: #8a94a6; font-size: 0.78rem; margin-top: 2px; }
  .player-status.is-live { color: #ff4b4b; }
  .player-status.is-finished { color: #5adc8c; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-row">
    <a href="index.html" class="back-link">← Menú</a>
    <h1>Torneos</h1>
    <span style="width:50px"></span>
  </div>

  <div id="authBar"><div class="auth-bar">Cargando sesión...</div></div>
  <div id="adminActions" class="admin-actions hidden" style="display:none;">
    <a href="importar-fixture.html">📥 Importar fixture</a>
    <a href="nuevo-torneo.html">✏️ Nuevo torneo (a mano)</a>
    <a href="admin.html">👤 Usuarios</a>
    <a href="catalogo.html">📋 Catálogo</a>
  </div>

  <div id="content"><div class="empty">Cargando...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="push-config.js"></script>
<script src="ui-alert.js"></script>
<script src="auth.js"></script>
<script>
  var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentProfile = null;
  let currentUserId = null;
  let activeReferees = null; // se carga solo si hace falta (admin viendo el detalle)

  // ------------------------------------------------------------
  // Suscribirse a los avisos de una pareja. Paso 1: solo pide permiso
  // y guarda la suscripcion en la base. Nada manda avisos todavia
  // (eso es el proximo paso).
  // ------------------------------------------------------------
  function urlBase64ToUint8Array(base64String) {
    const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
  }

  async function getOrCreatePushSubscription() {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      throw new Error("Este navegador no soporta notificaciones push.");
    }
    const permission = await Notification.requestPermission();
    if (permission !== "granted") {
      throw new Error("No diste permiso para las notificaciones.");
    }
    const registration = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    let subscription = await registration.pushManager.getSubscription();
    if (!subscription) {
      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }
    return subscription;
  }

  // ------------------------------------------------------------
  // Recordamos, en este navegador, a que parejas ya nos suscribimos
  // (no hay login, asi que no hay otra forma de "saber quien sos" -
  // y ademas la lectura de push_subscriptions esta reservada a admin).
  // ------------------------------------------------------------
  function getSubscribedPairs() {
    try { return JSON.parse(localStorage.getItem("subscribedPairs") || "[]"); }
    catch (e) { return []; }
  }
  function markPairSubscribed(pairId) {
    const set = new Set(getSubscribedPairs());
    set.add(pairId);
    localStorage.setItem("subscribedPairs", JSON.stringify([...set]));
  }
  function isPairSubscribed(pairId) {
    return getSubscribedPairs().includes(pairId);
  }

  function bellButtonHtml(pairId, label) {
    if (!pairId) return "";
    if (isPairSubscribed(pairId)) {
      // El tilde tambien es clickeable: la suscripcion push puede
      // vencerse sola del lado del servidor (Android/PWA la revoca
      // con el tiempo) sin que el navegador se entere — si eso pasa,
      // tocar el tilde la vuelve a registrar, sin depender de que el
      // usuario borre datos del navegador para que vuelva a salir la
      // campanita.
      return `<button class="sub-check" title="Ya estás anotado para avisos de ${escapeHtml(label)} — tocá para renovar la suscripción" onclick="subscribeToPair('${pairId}', this, true)">✅</button>`;
    }
    return `<button class="bell-btn" title="Avisarme sobre ${escapeHtml(label)}" onclick="subscribeToPair('${pairId}', this, false)">🔔</button>`;
  }

  async function subscribeToPair(pairId, btnEl, isRenewal) {
    const originalHtml = btnEl.outerHTML;
    const label = (btnEl.title || "").replace(/^Avisarme sobre /, "").replace(/ — tocá para renovar la suscripción$/, "");
    btnEl.disabled = true;
    btnEl.textContent = "⏳";
    try {
      const subscription = await getOrCreatePushSubscription();
      const json = subscription.toJSON();
      const { error } = await client.from("push_subscriptions").insert({
        pair_id: pairId,
        endpoint: json.endpoint,
        p256dh: json.keys.p256dh,
        auth: json.keys.auth,
      });
      // Si ya estaba suscripto (mismo navegador, misma pareja), Postgres
      // rechaza el insert duplicado con el codigo 23505 — eso no es un
      // error real para el usuario, ya estaba anotado igual (o, en el
      // caso de una renovacion, es lo esperado si la suscripcion vieja
      // en realidad seguia viva).
      if (error && error.code !== "23505") throw new Error(error.message);
      markPairSubscribed(pairId);
      btnEl.outerHTML = `<button class="sub-check" title="Ya estás anotado para avisos de ${escapeHtml(label)} — tocá para renovar la suscripción" onclick="subscribeToPair('${pairId}', this, true)">✅</button>`;
      if (isRenewal) showAlert("Suscripción renovada.", { type: "success" });
    } catch (err) {
      showAlert("No se pudo activar el aviso: " + err.message, { type: "error" });
      btnEl.outerHTML = originalHtml;
    }
  }

  const STATUS_LABEL = {
    draft: "Borrador",
    published: "Publicado",
    in_progress: "En curso",
    finished: "Finalizado",
    archived: "Archivado",
  };

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  function getTournamentIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("t");
  }

  // ------------------------------------------------------------
  // Listado de torneos
  // ------------------------------------------------------------
  async function loadTournamentList() {
    const { data: tournaments, error } = await client
      .from("tournaments")
      .select("*, seasons(year)")
      .order("created_at", { ascending: false });

    if (error) {
      document.getElementById("content").innerHTML =
        `<div class="empty">No se pudo cargar: ${escapeHtml(error.message)}</div>`;
      return;
    }
    if (!tournaments || tournaments.length === 0) {
      document.getElementById("content").innerHTML =
        '<div class="empty">Todavía no hay torneos cargados. Importá un fixture para crear el primero.</div>';
      return;
    }

    // progreso de partidos por torneo (para mostrar "5/19 jugados")
    const ids = tournaments.map((t) => t.id);
    const { data: matchCounts } = await client
      .from("matches")
      .select("tournament_id, is_finished")
      .in("tournament_id", ids);

    const progress = {};
    (matchCounts || []).forEach((m) => {
      if (!m.tournament_id) return;
      if (!progress[m.tournament_id]) progress[m.tournament_id] = { total: 0, done: 0 };
      progress[m.tournament_id].total++;
      if (m.is_finished) progress[m.tournament_id].done++;
    });

    document.getElementById("content").innerHTML = tournaments.map((t) => {
      const p = progress[t.id] || { total: 0, done: 0 };
      const sub = [t.edition, t.venue, t.seasons ? t.seasons.year : null].filter(Boolean).join(" · ");
      return `
        <div class="tournament-card" onclick="location.href='torneos.html?t=${t.id}'">
          <div class="t-top">
            <div>
              <div class="t-name">${escapeHtml(t.name)}</div>
              ${sub ? `<div class="t-sub">${escapeHtml(sub)}</div>` : ""}
            </div>
            <div class="t-status status-${t.status}">${STATUS_LABEL[t.status] || t.status}</div>
          </div>
          <div class="t-progress">${p.total ? `${p.done} / ${p.total} partidos jugados` : "Sin partidos cargados"}</div>
        </div>
      `;
    }).join("");
  }

  // ------------------------------------------------------------
  // Detalle de un torneo: partidos agrupados por categoría
  // ------------------------------------------------------------
  let currentMatches = [];
  let currentPairs = [];
  let activeTab = "matches"; // "matches" | "players"

  function normalizeText(s) {
    return String(s || "")
      .toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  async function loadTournamentDetail(tournamentId) {
    const [{ data: tournament, error: tErr }, { data: matches, error: mErr }, { data: pairs, error: pErr }] = await Promise.all([
      client.from("tournaments").select("*, seasons(year)").eq("id", tournamentId).single(),
      client.from("matches")
        .select("*, categories(name, display_order), courts(name)")
        .eq("tournament_id", tournamentId)
        .order("match_number", { ascending: true }),
      client.from("tournament_pairs")
        .select("*, categories(name, display_order)")
        .eq("tournament_id", tournamentId)
        .order("display_name", { ascending: true }),
    ]);

    if (tErr || !tournament) {
      document.getElementById("content").innerHTML =
        `<div class="empty">No se encontró el torneo.</div>`;
      return;
    }
    if (mErr) {
      document.getElementById("content").innerHTML =
        `<div class="empty">No se pudieron cargar los partidos: ${escapeHtml(mErr.message)}</div>`;
      return;
    }

    const sub = [tournament.edition, tournament.venue, tournament.seasons ? tournament.seasons.year : null]
      .filter(Boolean).join(" · ");

    const isAdminHeader = currentProfile && currentProfile.role === "admin";

    let html = `
      <div class="detail-header">
        <h2>${escapeHtml(tournament.name)}</h2>
        ${sub ? `<div class="meta">${escapeHtml(sub)}</div>` : ""}
        <div class="meta" style="margin-top:6px;">
          Estado: <span class="t-status status-${tournament.status}" style="margin-left:4px;">${STATUS_LABEL[tournament.status] || tournament.status}</span>
        </div>
        ${tournament.status === "draft"
          ? `<button class="publish-btn" onclick="publicarTorneo('${tournament.id}')">Publicar torneo</button>`
          : ""}
        ${isAdminHeader
          ? `<button class="delete-btn" data-name="${escapeHtml(tournament.name)}" onclick="borrarTorneo('${tournament.id}', this)">🗑️ Borrar torneo</button>`
          : ""}
      </div>
    `;

    currentMatches = matches || [];
    currentPairs = pairs || [];

    const isAdmin = currentProfile && currentProfile.role === "admin";
    if (isAdmin && activeReferees === null) {
      const { data: refs } = await client
        .from("profiles")
        .select("id, full_name, email")
        .eq("role", "referee")
        .eq("active", true)
        .order("full_name", { ascending: true });
      activeReferees = refs || [];
    }

    // categorias distintas presentes en este torneo, para los filtros
    const catNames = [...new Set(
      currentMatches.map((m) => m.categories ? m.categories.name : "Sin categoría")
        .concat(currentPairs.map((p) => p.categories ? p.categories.name : "Sin categoría"))
    )];
    const catOptions = catNames.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");

    html += `
      <div class="tab-row">
        <button class="tab-btn active" id="tabBtnMatches" onclick="switchTab('matches')">Partidos</button>
        <button class="tab-btn" id="tabBtnPlayers" onclick="switchTab('players')">Jugadores</button>
      </div>

      <div id="matchesTab">
        <div class="filter-row">
          <input type="text" id="matchSearchBox" class="search-box" placeholder="Buscar por jugador, N° de partido, cancha..." oninput="renderMatchesSection()" />
          <select id="matchCategoryFilter" onchange="renderMatchesSection()">
            <option value="">Todas las categorías</option>
            ${catOptions}
          </select>
        </div>
        <div id="matchesSection"></div>
      </div>

      <div id="playersTab" class="hidden-tab">
        <div class="filter-row">
          <input type="text" id="playerSearchBox" class="search-box" placeholder="Buscar jugador o pareja..." oninput="renderPlayersSection()" />
          <select id="playerCategoryFilter" onchange="renderPlayersSection()">
            <option value="">Todas las categorías</option>
            ${catOptions}
          </select>
        </div>
        <div id="playersSection"></div>
      </div>
    `;

    if (currentMatches.length === 0 && currentPairs.length === 0) {
      html += '<div class="empty">Este torneo todavía no tiene partidos ni parejas cargadas.</div>';
    }

    document.getElementById("content").innerHTML = html;
    if (currentMatches.length === 0 && currentPairs.length === 0) return;

    activeTab = "matches";
    renderMatchesSection();
    renderPlayersSection();
  }

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById("tabBtnMatches").classList.toggle("active", tab === "matches");
    document.getElementById("tabBtnPlayers").classList.toggle("active", tab === "players");
    document.getElementById("matchesTab").classList.toggle("hidden-tab", tab !== "matches");
    document.getElementById("playersTab").classList.toggle("hidden-tab", tab !== "players");
  }

  // ------------------------------------------------------------
  // Estado actual de una pareja, en base a sus partidos en este torneo.
  // ------------------------------------------------------------
  function pairStatus(pairId) {
    const pairMatches = currentMatches.filter((m) => m.pair_a_id === pairId || m.pair_b_id === pairId);
    if (pairMatches.length === 0) return { text: "Todavía sin partido asignado", cls: "" };

    const live = pairMatches.find((m) => m.is_live && !m.is_finished);
    if (live) {
      const courtTxt = live.courts ? ` en ${live.courts.name}` : "";
      return { text: `🔴 Jugando ahora${courtTxt} — Partido ${live.match_number ?? ""}`, cls: "is-live" };
    }

    const pending = pairMatches
      .filter((m) => !m.is_finished)
      .sort((a, b) => (a.match_number ?? 999) - (b.match_number ?? 999))[0];
    if (pending) {
      const courtTxt = pending.courts ? ` · ${pending.courts.name}` : "";
      return { text: `Próximo: Partido ${pending.match_number ?? "?"}${courtTxt}`, cls: "" };
    }

    return { text: "Finalizó su participación", cls: "is-finished" };
  }

  function renderPlayersSection() {
    const searchEl = document.getElementById("playerSearchBox");
    const catEl = document.getElementById("playerCategoryFilter");
    const term = normalizeText(searchEl ? searchEl.value.trim() : "");
    const catFilter = catEl ? catEl.value : "";

    let pairs = currentPairs;
    if (catFilter) {
      pairs = pairs.filter((p) => (p.categories ? p.categories.name : "Sin categoría") === catFilter);
    }
    if (term) {
      pairs = pairs.filter((p) => normalizeText(p.display_name).includes(term));
    }

    const sectionEl = document.getElementById("playersSection");
    if (!sectionEl) return;

    if (pairs.length === 0) {
      sectionEl.innerHTML = '<div class="empty">No encontré ningún jugador/pareja que coincida.</div>';
      return;
    }

    // agrupar por categoria
    const groups = {};
    pairs.forEach((p) => {
      const catName = p.categories ? p.categories.name : "Sin categoría";
      const catOrder = p.categories ? (p.categories.display_order ?? 999) : 999;
      if (!groups[catName]) groups[catName] = { order: catOrder, pairs: [] };
      groups[catName].pairs.push(p);
    });
    const sortedGroupKeys = Object.keys(groups).sort((a, b) => groups[a].order - groups[b].order || a.localeCompare(b));

    let html = "";
    sortedGroupKeys.forEach((catName) => {
      html += `<h3 class="group-title">Categoría ${escapeHtml(catName)}</h3>`;
      groups[catName].pairs.forEach((p) => {
        const status = pairStatus(p.id);
        html += `
          <div class="player-card">
            <div>
              <div class="player-name">${escapeHtml(p.display_name)}</div>
              <div class="player-status ${status.cls}">${escapeHtml(status.text)}</div>
            </div>
            ${bellButtonHtml(p.id, p.display_name)}
          </div>
        `;
      });
    });

    sectionEl.innerHTML = html;
  }

  function renderMatchesSection() {
    const searchEl = document.getElementById("matchSearchBox");
    const catEl = document.getElementById("matchCategoryFilter");
    const term = normalizeText(searchEl ? searchEl.value.trim() : "");
    const catFilter = catEl ? catEl.value : "";

    const isAdmin = currentProfile && currentProfile.role === "admin";

    let matches = currentMatches;
    if (catFilter) {
      matches = matches.filter((m) => (m.categories ? m.categories.name : "Sin categoría") === catFilter);
    }
    if (term) {
      matches = matches.filter((m) => {
        const haystack = [
          m.team_a_name, m.team_b_name,
          m.match_number != null ? `partido ${m.match_number}` : "",
          m.courts ? m.courts.name : "",
          m.categories ? m.categories.name : "",
        ].map(normalizeText).join(" | ");
        return haystack.includes(term);
      });
    }

    const sectionEl = document.getElementById("matchesSection");
    if (!sectionEl) return;

    if (matches.length === 0) {
      sectionEl.innerHTML = '<div class="empty">No encontré ningún partido que coincida.</div>';
      return;
    }

    // agrupar por categoria (display_order de la categoria si existe, sino nombre)
    const groups = {};
    matches.forEach((m) => {
      const catName = m.categories ? m.categories.name : "Sin categoría";
      const catOrder = m.categories ? (m.categories.display_order ?? 999) : 999;
      const key = catName;
      if (!groups[key]) groups[key] = { order: catOrder, matches: [] };
      groups[key].matches.push(m);
    });

    const sortedGroupKeys = Object.keys(groups).sort((a, b) => groups[a].order - groups[b].order || a.localeCompare(b));

    let html = "";
    sortedGroupKeys.forEach((catName) => {
      html += `<h3 class="group-title">Categoría ${escapeHtml(catName)}</h3>`;
      groups[catName].matches
        .sort((a, b) => (a.match_number ?? 999) - (b.match_number ?? 999))
        .forEach((m) => {
          const statusClass = m.is_finished ? "finished" : (m.is_live ? "live" : "");
          const statusTag = m.is_finished
            ? '<span class="finished-tag">Finalizado</span>'
            : (m.is_live ? '<span class="live-tag">🔴 EN VIVO</span>' : '<span class="pending-tag">Pendiente</span>');
          const courtTxt = m.courts ? ` · ${escapeHtml(m.courts.name)}` : "";

          let refereeRow = "";
          if (isAdmin) {
            const options = [`<option value="">Sin asignar</option>`]
              .concat((activeReferees || []).map((r) => {
                const label = escapeHtml(r.full_name || r.email);
                const selected = r.id === m.referee_user_id ? "selected" : "";
                return `<option value="${r.id}" ${selected}>${label}</option>`;
              }));
            refereeRow = `
              <div class="referee-row">
                <label>Árbitro:</label>
                <select onchange="asignarArbitro('${m.id}', this.value, this)">
                  ${options.join("")}
                </select>
              </div>
            `;
          }

          const bellA = bellButtonHtml(m.pair_a_id, m.team_a_name);
          const bellB = bellButtonHtml(m.pair_b_id, m.team_b_name);

          // Solo puede cargar/corregir resultado un admin, o el arbitro
          // asignado a ESTE partido puntual. A cualquier otra persona
          // (logueada o no) no le mostramos el link — igual no podria
          // entrar, y el resultado ya se ve arriba.
          const canEditThisMatch = isAdmin || (currentUserId && m.referee_user_id === currentUserId);
          const linksRow = canEditThisMatch
            ? `<div class="match-links">
                <a class="link-control" href="control.html?m=${m.id}">${m.is_finished ? "Ver / corregir" : "Cargar resultado"}</a>
              </div>`
            : "";

          html += `
            <div class="match-card ${statusClass}">
              <div class="match-top">
                <div class="match-label">${m.match_number ? `Partido ${m.match_number}` : "Partido"}${courtTxt}</div>
                ${statusTag}
              </div>
              <div class="match-score">
                ${escapeHtml(m.team_a_name)} ${bellA} <b>${m.score_a}</b> <span class="vs">—</span> <b>${m.score_b}</b> ${escapeHtml(m.team_b_name)} ${bellB}
              </div>
              ${linksRow}
              ${refereeRow}
            </div>
          `;
        });
    });

    sectionEl.innerHTML = html;
  }

  async function asignarArbitro(matchId, refereeId, selectEl) {
    const previousValue = selectEl.dataset.prev || "";
    selectEl.disabled = true;
    const { error } = await client
      .from("matches")
      .update({ referee_user_id: refereeId || null })
      .eq("id", matchId);
    selectEl.disabled = false;
    if (error) {
      showAlert("No se pudo asignar: " + error.message, { type: "error" });
      selectEl.value = previousValue;
      return;
    }
    selectEl.dataset.prev = refereeId;
    // Actualizamos tambien la copia local, asi si se vuelve a dibujar
    // esta seccion (por una busqueda, un filtro, etc.) sin recargar la
    // pagina, ya refleja el arbitro recien asignado.
    const match = currentMatches.find((m) => m.id === matchId);
    if (match) match.referee_user_id = refereeId || null;
  }

  async function publicarTorneo(id) {
    const ok = await showConfirm("¿Publicar este torneo? Va a quedar visible para todos.", { okLabel: "Sí, publicar" });
    if (!ok) return;
    const { error } = await client.from("tournaments").update({ status: "published" }).eq("id", id);
    if (error) {
      showAlert("No se pudo publicar: " + error.message, { type: "error" });
      return;
    }
    loadTournamentDetail(id);
  }

  // ------------------------------------------------------------
  // Borra un torneo entero (y todo lo que dependa de el: partidos,
  // cruces, parejas, canchas, dias — gracias a las migraciones 013 y
  // 014, que dejaron esas referencias en cascada). Pide escribir el
  // nombre exacto del torneo para confirmar, asi no se puede tocar
  // por accidente.
  // ------------------------------------------------------------
  async function borrarTorneo(id, btnEl) {
    const name = btnEl.dataset.name || "";
    const typed = await showPrompt(
      `Esto borra "${name}" Y TODOS sus partidos, parejas y canchas. No se puede deshacer.\n\nPara confirmar, escribí el nombre exacto del torneo:`,
      {
        title: "Borrar torneo",
        placeholder: name,
        okLabel: "Borrar",
        validate: (v) => (v.trim() !== name ? "El nombre no coincide." : null),
      }
    );
    if (typed === null) return; // cancelado
    btnEl.disabled = true;
    btnEl.textContent = "Borrando...";
    const { error } = await client.from("tournaments").delete().eq("id", id);
    if (error) {
      showAlert("No se pudo borrar: " + error.message, { type: "error" });
      btnEl.disabled = false;
      btnEl.textContent = "🗑️ Borrar torneo";
      return;
    }
    await showAlert("Torneo borrado.", { type: "success" });
    location.href = "torneos.html";
  }

  function updateAdminActions() {
    const el = document.getElementById("adminActions");
    const isAdmin = currentProfile && currentProfile.role === "admin";
    el.style.display = isAdmin ? "flex" : "none";
  }

  async function render() {
    const { session, profile } = await authRenderInto("authBar");
    currentProfile = profile;
    currentUserId = session ? session.user.id : null;
    activeReferees = null; // se vuelve a cargar si cambia de admin o de torneo
    updateAdminActions();

    const tId = getTournamentIdFromUrl();
    document.getElementById("content").innerHTML = '<div class="empty">Cargando...</div>';
    if (tId) {
      loadTournamentDetail(tId);
    } else {
      loadTournamentList();
    }
  }

  window.addEventListener("popstate", render);
  authWatch("authBar", render);
  render();
</script>
</body>
</html>
