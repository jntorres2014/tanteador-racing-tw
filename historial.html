<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b1320" />
<title>Racing Club TW — Historial</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b1320; color: #fff;
  }
  body { display: flex; justify-content: center; padding: 20px; }
  .wrap { width: 100%; max-width: 560px; }

  .logo-row { text-align: center; margin-bottom: 20px; }
  .logo-row img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
  .logo-row h1 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: 2px; margin: 8px 0 0; }

  .back-link { display: block; text-align: center; font-size: 0.8rem; color: #8a94a6; text-decoration: none; margin-bottom: 16px; }

  .match-card {
    background: #1b2433; border-radius: 14px; padding: 14px 16px;
    margin-bottom: 10px; border: 2px solid #3a4256;
  }
  .match-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .match-label { font-weight: 700; font-size: 0.95rem; }
  .match-date { font-size: 0.72rem; color: #8a94a6; }
  .match-score { font-size: 1.1rem; font-weight: 700; }
  .winner-a { color: #ff4b4b; }
  .winner-b { color: #3fa9f5; }

  .empty { text-align: center; color: #8a94a6; padding: 30px; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <img src="logo.png" alt="" />
    <h1>Historial de partidos</h1>
  </div>
  <a class="back-link" href="index.html">← Menú de partidos</a>

  <div id="list"><div class="empty">Cargando...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"\'']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric" }) +
      " " + d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
  }

  function render(matches) {
    const el = document.getElementById("list");
    if (!matches || matches.length === 0) {
      el.innerHTML = '<div class="empty">Todavía no hay partidos finalizados.</div>';
      return;
    }
    el.innerHTML = matches.map((m) => {
      const aWins = m.score_a > m.score_b;
      const bWins = m.score_b > m.score_a;
      return `
        <div class="match-card">
          <div class="match-top">
            <div class="match-label">${escapeHtml(m.label)}</div>
            <div class="match-date">${formatDate(m.updated_at)}</div>
          </div>
          <div class="match-score">
            <span class="${aWins ? "winner-a" : ""}">${escapeHtml(m.team_a_name)} ${m.score_a}</span>
            &nbsp;—&nbsp;
            <span class="${bWins ? "winner-b" : ""}">${m.score_b} ${escapeHtml(m.team_b_name)}</span>
          </div>
        </div>
      `;
    }).join("");
  }

  async function loadHistory() {
    const { data } = await client
      .from("matches")
      .select("*")
      .eq("is_finished", true)
      .order("updated_at", { ascending: false })
      .limit(100);
    render(data);
  }

  loadHistory();
</script>
</body>
</html>
